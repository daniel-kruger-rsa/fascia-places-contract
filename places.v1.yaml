openapi: 3.0.3
info:
  title: Fascia Places
  version: 0.30.0
  description: |
    Host-facing geography rail for platforms that organise people by place.

    A host is a platform that builds Places into its own product. Its members use the host's
    app, and the host's backend calls this API on their behalf with a host key, never from a
    client. The host owns its members, its communities and which cells they cover; Places
    answers questions about geography and knows nothing of members or communities.

    Pack generation mdb-zaf-2020 (MDB ADM1–4 + Stats SA MP/SP + GeoNames P).
    Harvest cells are subplaces. GeoNames are labels/search only.
    Levels are compared with `adm` (ADM1..ADM4, MP, SP, LOC), never with `kind`. A `kind` is the
    word a source uses for a level, and it differs by country: South Africa's ADM3 is a
    municipality, India's is a subdistrict. A `kind=` parameter accepts either, and an adm
    code resolves to whichever word that country's pack uses.

    Every response carries the header x-places-generation, except the two that assert no
    generation because none applies: a 404 for a country with no pack, and a 404 for a path that
    does not exist. Persist area_id with generation, and the country with it.

    Switch on error.code, never on the status alone. Two 404s mean different things:
    no_pack_for_country is a settled answer about a country, while not_found is a path this
    deployment does not have, which is a client bug or a stale client. A path that does not exist
    answers 404 with or without a host key: existence is not a function of who is asking.
    A path that does exist answers 401 until the key is right.
  contact:
    name: Fascia Places
servers:
  - url: https://places.fascia.network
    description: Production
  - url: http://localhost:8080
    description: Local compose
security:
  - hostKey: []

tags:
  - name: public
  - name: resolve
  - name: overlay
  - name: harvest

paths:
  /health:
    get:
      tags: [public]
      security: []
      summary: Process up
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  build:
                    type: string
                    example: e8ebb238da7f
                    description: |
                      An opaque fingerprint of the deployed build, twelve hex characters. It is
                      not the image tag: the tag is a commit sha and this endpoint is public, so
                      what is published is sha256(tag) truncated. Diagnostic rather than
                      contractual, and it answers one question: is the build answering the one I
                      expect, which the asker can fingerprint for itself. It changes on every
                      deploy and is stable within one. "unknown" where the deployment does not
                      set a build, such as a local stack.

  /v1/places/generation:
    get:
      tags: [public]
      security: []
      summary: Active pack generation for a country
      description: |
        The generation a host pins, for the country it asks about. Cadence follows census years,
        so each country has its own. A country with no pack is refused, never answered with the
        default country's generation.

        This is also the capability probe. `loaded` is false for a country that is configured but
        whose pack has not been ingested: it answers with its own generation, correctly, and holds
        nothing. A probe reading the generation alone would report ready while every read came back
        empty, so read `loaded` with it.
      parameters:
        - $ref: "#/components/parameters/country"
      responses:
        "200":
          description: Generation id hosts must pin, with the country it belongs to
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string, example: ZA }
                  generation: { type: string, example: mdb-zaf-2020 }
                  loaded:
                    type: boolean
                    description: An ingest has run for this country and generation
                    example: true
                  contract:
                    type: string
                    example: 0.17.0
                    description: |
                      The version of this document that the deployment implements. Compare it at
                      boot against the version you vendored: a pinned copy says what you expect,
                      and without this there was nothing to check it against. A deployment below
                      your floor deserves its own failure reason — the server is older than your
                      app expects — and never a claim about geography. Also returned as the
                      x-places-contract header on every response that carries x-places-generation.
                  attribution:
                    type: array
                    description: |
                      The display duty for this country and generation: the credits whose sources
                      require acknowledgement, each with the wording that source has approved.
                      Empty where no source of this pack asks for one.

                      Read it here rather than collecting it from reads. The duty is static per
                      pack, this endpoint needs no host key, so a licence screen can be built
                      before anything else is called — and three read endpoints answer with a
                      bare JSON array and have nowhere to carry a credit at all.
                    items:
                      $ref: "#/components/schemas/Attribution"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }

  /v1/places/building/{building_id}:
    get:
      tags: [resolve]
      summary: One structure
      description: |
        What a host stores after a member confirms a candidate. building_id is minted by
        Places and stable within a generation; source_ref keeps the source's own key because
        no ML footprint source publishes a stable id.
      parameters:
        - in: path
          name: building_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: The structure, or {} when the id is unknown
          content:
            application/json:
              schema:
                type: object
                properties:
                  building_id: { type: string, format: uuid }
                  generation: { type: string }
                  country: { type: string }
                  source: { type: string, example: google_open_buildings }
                  source_ref: { type: string, nullable: true }
                  area_m2: { type: integer, nullable: true }
                  lng: { type: number }
                  lat: { type: number }
                  area:
                    $ref: "#/components/schemas/AreaRef"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/coverage:
    get:
      tags: [public]
      security: []
      summary: What this pack can answer for a country
      description: |
        Identity (can a building be identified at all) and attributes (entrance ref, floors,
        house numbers) reported separately on purpose. crowding_10m sizes a building picker
        and is measured rather than derived from density. measured:false means no ingest has
        measured that country — not an error.
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Measures and guidance
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string, example: ZA }
                  generation: { type: string }
                  measured: { type: boolean }
                  layers:
                    type: object
                    description: |
                      What this pack holds, read from the data rather than from what an ingest
                      recorded. false means the layer is ABSENT, not empty. A host must check
                      here before rendering a zero from /v1/places/streets, /area/{id}/neighbours,
                      the stats object on /area/{id}, or include=building as "none here": an
                      absent layer and an empty layer are identical in those responses. Every
                      key is present either way, including for a country that is configured but
                      has never been ingested, where all of them read false.
                    properties:
                      cells: { type: boolean, description: "Polygon layers, so /areas/search and /point can answer" }
                      geonames: { type: boolean, description: "GeoNames points, so /search can answer" }
                      streets: { type: boolean, description: "Street layer, so /streets can answer" }
                      cell_stats: { type: boolean, description: "Per-cell measures, the stats object on /area/{id}" }
                      neighbours: { type: boolean, description: "Adjacency, so /area/{id}/neighbours can answer" }
                      buildings: { type: boolean, description: "Structures, so include=building can answer" }
                  measures:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        value: { type: number, nullable: true }
                        detail: { type: object }
                  guidance:
                    type: object
                    properties:
                      building_candidates: { type: integer, nullable: true }
                      entrance_picker: { type: boolean, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }

  /v1/places/generations:
    get:
      tags: [public]
      security: []
      summary: Generations this pack holds
      description: |
        During a geography change the old and the new generation are loaded side by side.
        Any read accepts ?generation= to choose one; omitting it serves the default.
      responses:
        "200":
          description: Default generation and everything loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_country: { type: string, example: ZA }
                  default: { type: string, example: mdb-zaf-2020, description: "The default country's generation; the single-country shape, kept for hosts written against it." }
                  countries:
                    type: array
                    description: Every country this deployment serves, each with its own default and generations.
                    items:
                      type: object
                      properties:
                        country: { type: string, example: ZA }
                        default: { type: string }
                        loaded: { type: boolean, description: "False when a country is configured but not yet ingested." }
                        generations:
                          type: array
                          items: { type: object }
                  generations:
                    type: array
                    items:
                      type: object
                      properties:
                        generation: { type: string }
                        loaded_at: { type: string, format: date-time }
                        layers:
                          type: array
                          items: { type: string }
                        default: { type: boolean }

  /v1/places/layers:
    get:
      tags: [public]
      security: []
      summary: Layer catalogue
      description: |
        The same layers everywhere, but the response carries a generation, and a generation
        belongs to a country: a country with no pack is refused here too.

        Each layer also says **which vintage it is of**, and whether that vintage describes
        what is in force. One generation can hold layers on different cadences from different
        custodians, so the generation name cannot tell you.

        Three states, and `current` is the one to branch on: **not yet in force** before
        `effective_from`, **in force**, and **superseded** from `superseded_from`. A boundary
        that has been published is not yet a boundary that exists — South Africa's 2026 ward
        delimitation was downloadable in September 2026 and applies from election day.
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: ADM1–4, MP, SP, LOC, GN, ST, each with its vintage where the pack records one
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string, example: ZA }
                  generation: { type: string, example: mdb-zaf-2020 }
                  layers:
                    type: array
                    items:
                      type: object
                      properties:
                        adm: { type: string, example: SP }
                        kind: { type: string, example: subplace }
                        vintage:
                          type: string
                          example: "2011"
                          description: |
                            The year this layer's boundaries represent. Omitted, with the three
                            fields below, on a layer whose pack records no vintage — omitted
                            rather than null, so a client reads undefined instead of having to
                            pattern-match a placeholder.
                        effective_from:
                          type: string
                          format: date
                          example: "2026-11-04"
                          description: |
                            The date from which this layer describes what is in force. Present
                            where a boundary was published before it applied: South Africa's
                            2026 ward delimitation was downloadable in September and takes
                            effect on election day. Until then the cells are real and
                            resolvable, and `current` is false.
                        superseded_by:
                          type: string
                          example: MDB ward delimitation 2024/2026
                          description: |
                            A newer vintage of this layer that is known to exist. On its own it
                            does **not** mean this layer is wrong: a census is a snapshot, and
                            the 2011 snapshot stays a true description of 2011.
                        superseded_from:
                          type: string
                          format: date
                          example: "2026-11-04"
                          description: |
                            The date from which this layer stops describing what is in force.
                            Present only where "in force" is a real idea, which for boundaries
                            means the administrative ones: a ward exists because a delimitation
                            says so. South Africa's wards change on election day.
                        current:
                          type: boolean
                          example: true
                          description: |
                            **Branch on this.** True only while the layer describes what is in
                            force: false before `effective_from` and false from
                            `superseded_from`. A newer vintage merely existing leaves it true,
                            because only a dated change moves it. Computed per request against
                            the server's date, so a layer changes state on the day it changes
                            with no deployment involved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }

  /v1/places/point:
    get:
      tags: [resolve]
      summary: Resolve a WGS84 point to the admin/place stack
      parameters:
        - $ref: "#/components/parameters/lng"
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
        - in: query
          name: kind
          schema: { type: string }
          description: Filter to one layer (ADM1|ADM2|ADM3|ADM4|MP|SP or kind name). Omit for full stack. LOC never answers here, because a locality holds no polygon and so no coordinate is inside one.
        - in: query
          name: include
          schema: { type: string, example: building }
          description: |
            Comma-separated extras. "building" adds a ranked candidate list of structures
            within 60 m, sized by the cell's crowding, with confirm_required true. Omitted,
            no building data is returned: a structure is closer to a home than a cell is.
      responses:
        "200":
          description: Smallest area + layers + stack + nearest GeoNames place. Miss returns lat/lng/place only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Unavailable" }

  /v1/places/search:
    get:
      tags: [resolve]
      summary: Search GeoNames populated places by name
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Up to 20 name hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeonameHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/areas/search:
    get:
      tags: [resolve]
      summary: Search polygon layers (ADM1–4, MP, SP) and unofficial cells (LOC) by name
      description: |
        Case-insensitive match on the area name; the query is matched literally.
        Order: exact name, then prefix, then contains; larger layers first; shorter names first.
        Each hit carries its parent chain (large → small) so repeated names can be told apart.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: kind
          schema: { type: string }
          description: One layer or a comma-separated list (ADM1|ADM2|ADM3|ADM4|MP|SP|LOC or kind names). Default all seven. A layer the pack does not hold answers 200 with an empty array, not 400. GN is not an area layer; use /v1/places/search.
        - in: query
          name: within
          schema: { type: string, format: uuid }
          description: |
            Constrain the search to this area. Resolved by **geometry** when the target has a
            polygon — is the candidate's point-on-surface inside it — and by **ancestry** when it
            does not: is the target anywhere in the candidate's parent chain. For a pack built
            from one hierarchy ancestry is containment rather than an approximation of it.

            A target with no geometry that nothing claims as a parent is refused with
            400 within_unsupported: neither mechanism can say what is inside it, and an empty
            list would be indistinguishable from "no matches". Unknown id still gives an empty
            list, which is its documented behaviour.
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Area hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Unavailable" }

  /v1/places/streets:
    get:
      tags: [resolve]
      summary: Search street names (OpenStreetMap, ODbL)
      description: |
        Labels, not harvest cells. One row per street per sub-place, so every hit carries its
        sub-place and that cell's parent chain. Queries are normalised the way the ingest
        normalised names ("Main Rd" finds "Main Road").
        Responses carry attribution; the host must display it wherever a street name appears.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: within
          schema: { type: string, format: uuid }
          description: Only streets in this area, or in cells inside it.
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Street hits with attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreetSearchResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Unavailable" }

  /v1/places/area/{area_id}/neighbours:
    get:
      tags: [resolve]
      summary: Cells touching this one
      description: |
        Harvest planning asks "what should this group take next", which is adjacency, not a
        viewport. Sub-places only; any other layer returns an empty list. Adjacency is by
        intersection, not strict touching: census polygons share slivers and rounding.
      parameters:
        - $ref: "#/components/parameters/areaId"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Neighbouring cells, each with its own measures
          content:
            application/json:
              schema:
                type: object
                properties:
                  area_id: { type: string, format: uuid }
                  generation: { type: string }
                  count: { type: integer }
                  neighbours:
                    type: array
                    items:
                      type: object
                      properties:
                        area_id: { type: string, format: uuid }
                        name: { type: string }
                        kind: { type: string, example: subplace }
                        adm: { type: string, example: SP }
                        country: { type: string }
                        area_km2: { type: number, nullable: true }
                        land_class: { type: string, nullable: true }
                        buildings: { type: integer, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/street/{street_id}/geojson:
    get:
      tags: [overlay]
      summary: One street's line
      parameters:
        - in: path
          name: street_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: MultiLineString FeatureCollection with attribution; unknown id gives an empty collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "403": { $ref: "#/components/responses/GeometryNotServed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/geonames:
    get:
      tags: [overlay]
      summary: GeoNames points in a viewport
      parameters:
        - $ref: "#/components/parameters/west"
        - $ref: "#/components/parameters/south"
        - $ref: "#/components/parameters/east"
        - $ref: "#/components/parameters/north"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
        - in: query
          name: limit
          schema: { type: integer, default: 250, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Point FeatureCollection (generation, kind geoname, adm GN, count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/crosswalk:
    get:
      tags: [harvest]
      summary: What became of a cell when the geography changed
      description: |
        Maps `area_id`s from one generation to another, for a host re-linking stored ids after
        a cutover.

        **It returns every successor with its share, not one id**, because one id is always
        available and often wrong. Measured on Census 2011 against Census 2022 sub-places:
        86.2% of old cells have exactly one successor, 13.8% split into two or more, and every
        single old centre falls inside some new cell. A single-id answer would be well formed
        and wrong for one cell in seven.

        **`same` is a claim about ground, not about your link.** It says the cell did not
        change. Whether the link was correct when it was made is a question this endpoint
        cannot reach, and a crosswalk run is often the only moment anybody looks at an old
        link — which makes it the right moment to check the thing the geometry cannot see.
        `from_name` is there for that.

        **Branch on `verdict`** rather than on the shares:

        | `verdict` | Means | Do |
        | --- | --- | --- |
        | `same` | One successor holding 98% or more of the old cell | Re-point the id |
        | `moved` | One successor, 50-98% | Re-point it; the boundary moved materially |
        | `split` | Two or more successors | Ask a person. Which one a member belongs to is not a geometry question |
        | `unresolved` | No successor holds half the old cell | Do not guess. Keep the old id, or send someone to look -- and read `rejected`, which says what was considered and refused |
        | `unknown` | This generation does not hold that `area_id` | Your id is wrong, not your cell |

        `unknown` is deliberately not `unresolved`: an id from the wrong country, the wrong
        layer or a typo must not be reported as a cell with no successor.

        A generation pair whose crosswalk has not been computed answers **404
        `crosswalk_not_loaded`**, naming the pair. That is not a claim that the cells are
        unchanged.

        **Neither generation has to still be loaded.** A crosswalk outlives the generations it
        maps between, which is the point of it: once the old generation is dropped, a host
        still holding its ids needs this answer more than it did before. A successor's `name`
        and `kind` are omitted when the target generation is no longer loaded; its `area_id`
        and `basis` are always there.

        **`basis` says how a successor was found, and only the field that basis measured is
        present.** `overlap` carries `share`, `proximity` carries `meters`, `feature` carries
        neither. A host branching on `verdict` alone cannot tell a cell measured to overlap its
        successor from one that was merely the nearest thing to it, and those warrant different
        confidence.

        **An `unresolved` can now say what it refused.** `rejected` lists the candidates the
        crosswalk considered and declined, nearest first, each with a distance and a reason. It
        is a **separate array from `to`** so that a refusal can never be picked up by the loop a
        client already writes over successors -- "do not guess" enforced by the shape rather than
        by this paragraph. It appears where candidates were refused and is omitted where none
        were, which on every crosswalk computed before 28 October 2026 is all of them.
      parameters:
        - $ref: "#/components/parameters/country"
        - name: from
          in: query
          required: true
          schema: { type: string, example: mdb-zaf-2020 }
          description: The generation the stored ids belong to
        - name: to
          in: query
          required: true
          schema: { type: string, example: stats-sa-2022 }
          description: The generation to map them into
        - name: area_id
          in: query
          required: true
          schema: { type: string }
          description: One area_id, or up to 200 comma-separated
      responses:
        "200":
          description: One result per area_id asked for, in the order asked
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string, example: ZA }
                  from: { type: string, example: mdb-zaf-2020 }
                  to: { type: string, example: stats-sa-2022 }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        area_id: { type: string, format: uuid }
                        from_name:
                          type: string
                          example: Cedar Lakes
                          description: |
                            What this cell was called under `from`, carried in the crosswalk
                            itself rather than looked up — so it survives the old generation
                            being dropped.

                            **Put it beside your own name for the thing you linked.** A
                            `verdict` of `same` certifies that the ground did not change; it
                            cannot certify that the link was ever right. A host re-linking two
                            communities found one that had been placed four weeks earlier on
                            the cell whose *name* matched the community, 1.7 km from the ground
                            it occupies — and `same` would have carried it forward at full
                            confidence. `Cedar Lakes` against `Needwood` is a mismatch a person
                            reads in a second and a script cannot.
                        verdict:
                          type: string
                          enum: [same, moved, split, unresolved, unknown]
                        to:
                          type: array
                          description: |
                            Successors, best first: largest `share` where one was measured,
                            then nearest `meters`. Empty for `unknown`, and for an
                            `unresolved` cell that has no successor above the threshold at all.
                            An `unresolved` cell with partial overlaps still lists them: the
                            verdict says do not re-point automatically, not that nothing is known.
                          items:
                            type: object
                            properties:
                              area_id: { type: string, format: uuid }
                              name: { type: string, example: Ennerdale Ext 14 }
                              kind: { type: string, example: subplace }
                              adm: { type: string, example: SP }
                              basis:
                                type: string
                                enum: [overlap, feature, proximity]
                                example: overlap
                                description: |
                                  HOW this successor was found, and it decides which of the two
                                  fields below is present. `overlap` carries `share` and no
                                  `meters`; `proximity` carries `meters` and no `share`;
                                  `feature` carries neither, because the same source feature on
                                  both sides is its own evidence. Branch on this before reading
                                  either number.
                              share:
                                type: number
                                example: 0.41
                                description: |
                                  Fraction of the OLD cell's area that this successor holds.
                                  Present only when `basis` is `overlap`, because it is what an
                                  overlap measured. Absent, not zero, otherwise: a zero would
                                  read as a measured absence of overlap.
                              meters:
                                type: number
                                example: 413
                                description: |
                                  Distance from the old cell's point to this successor, in whole
                                  meters. Present only when `basis` is `proximity`. Spelt
                                  `meters`, as on a GeoNames hit.
                        rejected:
                          type: array
                          description: |
                            Candidates this cell's crosswalk **considered and refused**, nearest
                            first, each with why. Present only where some were refused -- omitted,
                            never `[]`, because an empty array would say we looked and found
                            nothing, and on a polygon crosswalk nothing looks.

                            **Nothing here is a successor.** It is a separate array from `to`
                            precisely so that the loop you already write over `to` can never pick
                            one up. Do not re-point a member onto one of these on the strength of
                            a short distance: the verdict is `unresolved`, and these are the
                            reasons it is.

                            **What it is for.** A bare `unresolved` invites whoever implements
                            the screen next to go and fetch candidates themselves, unbounded --
                            which is exactly what the measurement rules out: the distance a
                            disappeared place feature sits from the nearest surviving one has a
                            median that swings **27x** between consecutive years, so a radius
                            fitted anywhere but the one place it was measured is wrong. The
                            refusals travel with the answer so nobody re-derives them. Asked for
                            by a host on 28 October 2026, in those terms.

                            It is also what makes an `unresolved` something a screen can render
                            and a person can decide, rather than a null that renders as nothing.
                          items:
                            type: object
                            properties:
                              area_id: { type: string, format: uuid }
                              name: { type: string, example: Sonavade }
                              meters:
                                type: number
                                example: 1841
                                description: |
                                  Distance from the old cell's point to this candidate, in whole
                                  meters. Always present -- a refusal with no distance on it is
                                  the thing this array exists to replace.
                              reason:
                                type: string
                                enum: [ambiguous, outside_radius, outside_parent, no_radius, no_parent, parent_unresolved]
                                example: outside_radius
                                description: |
                                  Why this candidate was refused. Not interchangeable -- a thing
                                  400 m away in the wrong parent and a thing 1.8 km away in the
                                  right one are different problems for whoever looks:

                                  | | |
                                  | --- | --- |
                                  | `ambiguous` | Inside the parent's successor and within the radius, but another candidate was nearly as close, so which one succeeded the cell is not decidable from distance |
                                  | `outside_radius` | Inside the parent's successor, farther than the radius |
                                  | `outside_parent` | Within the radius, not inside the parent's successor |
                                  | `no_radius` | The old cell's parent has no measured movement distribution, so no radius was applied at all |
                                  | `no_parent` | The old cell had no official parent, so no candidate set could be formed |
                                  | `parent_unresolved` | The parent itself has no successor |

                                  `no_radius`, `no_parent` and `ambiguous` are the **common**
                                  answers, not edges. Of 39,699 localities in the first
                                  Maharashtra pack, 6,622 have no official parent at all and
                                  only **282** have a parent whose class has a measured radius —
                                  and within those 282 there are on average **8.8** other
                                  localities inside the same parent and within 1 km, because the
                                  parent there *is* the city. So the nearest candidate is usually
                                  not identifiably the successor, and **243 of the 282** are
                                  `ambiguous` rather than matched. A locality crosswalk refuses
                                  far more often than it matches by proximity, deliberately: a
                                  `moved` verdict is issued only where the nearest candidate is
                                  at least three times closer than the next one.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No pack for this country, or no crosswalk computed for this generation pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/places/harvest:
    get:
      tags: [harvest]
      summary: Uncovered harvest cells (default subplace) in a bbox
      parameters:
        - $ref: "#/components/parameters/west"
        - $ref: "#/components/parameters/south"
        - $ref: "#/components/parameters/east"
        - $ref: "#/components/parameters/north"
        - in: query
          name: kind
          schema: { type: string, default: subplace }
        - in: query
          name: covered
          schema: { type: string }
          description: Comma-separated area_id UUIDs already selected. At most 200; more or non-UUID values are 400.
        - in: query
          name: summary
          schema: { type: string, enum: ["1", "true"] }
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Array of cells, or counts when summary=1
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/HarvestCell"
                  - $ref: "#/components/schemas/HarvestSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/geojson:
    get:
      tags: [overlay]
      summary: Viewport polygons for one layer
      description: |
        Bbox is required for ward, mainplace and subplace (400 without). Province, district and
        municipality may be fetched pack-wide. Feature properties carry area_id, name, kind, adm, generation.
      parameters:
        - in: query
          name: kind
          schema: { type: string, default: subplace }
        - $ref: "#/components/parameters/westOpt"
        - $ref: "#/components/parameters/southOpt"
        - $ref: "#/components/parameters/eastOpt"
        - $ref: "#/components/parameters/northOpt"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/generation"
        - in: query
          name: simplify
          schema: { type: number, default: 0.0006, maximum: 0.05 }
        - in: query
          name: limit
          schema: { type: integer, default: 2500, minimum: 1, maximum: 8000 }
      responses:
        "200":
          description: FeatureCollection with count and total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "403": { $ref: "#/components/responses/GeometryNotServed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/area/{area_id}:
    get:
      tags: [resolve]
      summary: Area properties by id
      parameters:
        - $ref: "#/components/parameters/areaId"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: Area or empty object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoPackForCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/places/area/{area_id}/geojson:
    get:
      tags: [overlay]
      summary: One area as simplified GeoJSON (highlight / fitBounds)
      parameters:
        - $ref: "#/components/parameters/areaId"
        - $ref: "#/components/parameters/generation"
      responses:
        "200":
          description: FeatureCollection with 0 or 1 feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    hostKey:
      type: http
      scheme: bearer
      description: |
        A per-host key, issued by Fascia and held server-side by the host. Never in a client
        bundle: a key in a browser is a key published. Each deployment sets its own in HOST_KEYS,
        including dev stacks, so no key value is written down here.

  parameters:
    generation:
      in: query
      name: generation
      schema: { type: string }
      description: |
        Read a generation other than the country's default. Resolved within the country asked
        for: a generation that exists for another country is refused with 400, because a
        generation of one pack is not a generation of another. See /v1/places/generations.
    lng:
      in: query
      name: lng
      required: true
      schema: { type: number, example: 28.0473 }
    lat:
      in: query
      name: lat
      required: true
      schema: { type: number, example: -26.2041 }
    country:
      in: query
      name: country
      schema: { type: string, default: ZA }
    west:
      in: query
      name: west
      required: true
      schema: { type: number }
    south:
      in: query
      name: south
      required: true
      schema: { type: number }
    east:
      in: query
      name: east
      required: true
      schema: { type: number }
    north:
      in: query
      name: north
      required: true
      schema: { type: number }
    westOpt:
      in: query
      name: west
      schema: { type: number }
    southOpt:
      in: query
      name: south
      schema: { type: number }
    eastOpt:
      in: query
      name: east
      schema: { type: number }
    northOpt:
      in: query
      name: north
      schema: { type: number }
    areaId:
      in: path
      name: area_id
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Area:
      type: object
      properties:
        stats:
          allOf:
            - $ref: "#/components/schemas/AreaStats"
          description: Present on GET /v1/places/area/{area_id} when an ingest has measured the cell.
        attribution:
          type: array
          description: Credits the measures require; present with stats.
          items:
            $ref: "#/components/schemas/Attribution"
        area_id: { type: string, format: uuid }
        geoname_id: { type: integer, nullable: true }
        name: { type: string }
        kind:
          type: string
          enum: [province, district, municipality, subdistrict, ward, mainplace, subplace, locality]
          description: |
            The word the source itself uses, which differs by country at the same level:
            South Africa's ADM3 is a `municipality`, India's is a `subdistrict` (a taluk,
            tehsil or mandal), and the two are nothing alike as things. **Branch on `adm`,
            not on `kind`** — adm is the comparable level, kind is local vocabulary and the
            list grows as countries are added.
        country: { type: string, example: ZA }
        codes: { type: object }
        parent_ids:
          type: array
          items: { type: string, format: uuid }
        generation: { type: string }

    GeonameHit:
      type: object
      properties:
        geoname_id: { type: integer }
        name: { type: string }
        feature_class: { type: string, example: P }
        feature_code: { type: string, example: PPLA }
        capital_of:
          type: string
          nullable: true
          enum: [national, province, district, municipality]
          description: Derived from feature_code, so hosts need not know the GeoNames codes.
        admin1: { type: string }
        lng: { type: number }
        lat: { type: number }
        meters: { type: integer }

    AreaRef:
      type: object
      properties:
        area_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, example: municipality }
        adm: { type: string, example: ADM3 }

    AreaHit:
      type: object
      properties:
        area_id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [province, district, municipality, subdistrict, ward, mainplace, subplace, locality]
        adm: { type: string, example: SP }
        country: { type: string, example: ZA }
        generation: { type: string }
        parents:
          type: array
          description: Parent chain, large → small (e.g. ADM1, ADM2, ADM3, MP for a subplace). Empty for provinces.
          items:
            $ref: "#/components/schemas/AreaRef"
        codes:
          type: object
          additionalProperties: true
          description: |
            The source's own identifiers for this cell, as
            `GET /v1/places/area/{area_id}` has always returned them — a Stats SA `sp_code`, an
            MDB `ward_no`, an LGD `vill_lgd`, an OSM `osm_type` and `osm_id`. Keys vary by
            country and layer, so treat it as an open map and read only what you need.

            **New in 0.29.0.** A `locality` carries its `osm_type` and `osm_id` here, which are
            its identity — the name is explicitly not — and `same_name_as_parent: true` where its
            name matches its official parent's. This endpoint is the only way to reach a
            locality, because `LOC` never answers `/point`, so a mark absent here cannot be read
            at all. Always present; `{}` for a cell whose source supplies no codes.
        bbox:
          type: array
          description: |
            `[west, south, east, north]`, WGS84. Present only for a cell with a real extent.
            **Omitted entirely for a cell with no geometry** (since `0.18.0`) **and for a cell
            whose geometry is a point** (since `0.29.0`) — a point's extent is zero, and
            `[x, y, x, y]` is a degenerate box a pipeline is right to reject. A `locality` is
            always a point, so a `LOC` hit never carries this and always carries `lng`/`lat`.
          minItems: 4
          maxItems: 4
          items: { type: number }
        lng:
          type: number
          example: 73.898845
          description: |
            Present instead of `bbox` for a cell whose geometry is a point — today that means
            every `locality`. Same shape a GeoNames hit has always had. **New in 0.29.0.**
        lat:
          type: number
          example: 17.108466
          description: See `lng`. **New in 0.29.0.**

    Attribution:
      type: object
      properties:
        source: { type: string, example: OpenStreetMap }
        text: { type: string, example: "© OpenStreetMap contributors" }
        url: { type: string, example: "https://www.openstreetmap.org/copyright" }
        license: { type: string, example: ODbL 1.0 }
        statement:
          type: string
          description: |
            The full acknowledgement a rights holder has approved, in that rights holder's own
            words, present only where one has been supplied. Where it is present, show it:
            `text` is the short line that goes under a map, and `statement` is what belongs on
            a licence or about screen. Statistics South Africa supplied theirs on
            20 October 2026, and it covers both acknowledgement and the terms on which the
            boundaries may be charged for.

    StreetHit:
      type: object
      properties:
        street_id: { type: string, format: uuid }
        name: { type: string, example: Atterbury Road }
        highway: { type: string, example: primary }
        length_m: { type: integer }
        subplace:
          $ref: "#/components/schemas/AreaRef"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/AreaRef"
        bbox:
          type: array
          description: |
            `[west, south, east, north]`, WGS84. Always present: a street always has geometry.

            **A street's box may be degenerate in one axis, and that is not a defect.** A street
            drawn exactly north–south has `west == east`; one drawn exactly east–west has
            `south == north`. Both are the street's true extent, so do not reject the hit and do
            not widen the box. This is said because the rule for an *area* is the opposite — an
            area with no extent omits `bbox` and answers `lng`/`lat` instead (`0.29.0`) — and a
            pipeline that learned the area rule and applied it here would drop real streets. The
            difference is that a point has no extent in either axis while a line has one in at
            least one, so a street is never reduced to a coordinate pair.

            Stated as a property of the geometry, not as a count: how many streets in a given
            pack are axis-aligned has not been measured, and a host must not assume the answer
            is zero because its own sample found none.
          minItems: 4
          maxItems: 4
          items: { type: number }

    StreetSearchResponse:
      type: object
      properties:
        generation: { type: string }
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/Attribution"
        count: { type: integer }
        streets:
          type: array
          items:
            $ref: "#/components/schemas/StreetHit"

    NearestStreet:
      type: object
      nullable: true
      properties:
        street_id: { type: string, format: uuid }
        name: { type: string }
        highway: { type: string }
        sp_area_id: { type: string, format: uuid }
        meters: { type: integer }

    PointResponse:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          properties:
            lat: { type: number }
            lng: { type: number }
            place:
              type: object
              allOf:
                - $ref: "#/components/schemas/GeonameHit"
              nullable: true
            nearby:
              type: array
              items:
                $ref: "#/components/schemas/GeonameHit"
            street:
              allOf:
                - $ref: "#/components/schemas/NearestStreet"
              description: Nearest named street within 120 m, or null. Often null outside metros.
            attribution:
              type: array
              description: Present when the response carries street data.
              items:
                $ref: "#/components/schemas/Attribution"
            layers:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Area"
            stack:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Area"
                  - type: object
                    properties:
                      adm: { type: string, example: SP }

    HarvestCell:
      type: object
      properties:
        area_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, example: subplace }
        country: { type: string, example: ZA }
        generation: { type: string }

    AreaStats:
      type: object
      description: |
        Coverage denominators for one cell. Measure coverage against road_km or buildings, not
        against named streets: named-street availability tracks OSM volunteer effort (96% of
        Gauteng sub-places, 12% of Eastern Cape ones), not where people live.
      properties:
        road_km: { type: number, nullable: true, description: "All street-like OSM ways in the cell, named or not" }
        named_road_km: { type: number, nullable: true }
        buildings: { type: integer, nullable: true, description: "Google Open Buildings structures whose centroid falls in the cell" }
        area_km2: { type: number, nullable: true }
        crowding_10m:
          type: number
          nullable: true
          description: Mean other structures within 10 m. Sizes a building picker; measured, not derived from density.
        building_candidates:
          type: integer
          nullable: true
          description: How many candidates a picker should offer in this cell.
        land_class:
          type: string
          nullable: true
          enum: [urban, non_urban, agricultural_holdings, smallholdings]
          description: MP and SP only; inferred from the Stats SA name suffix. Null for admin layers.
        centroid:
          type: object
          nullable: true
          description: A point on the cell (ST_PointOnSurface), for pinning a label.
          properties:
            lng: { type: number }
            lat: { type: number }

    HarvestSummary:
      type: object
      properties:
        generation: { type: string }
        kind: { type: string, example: subplace }
        uncovered: { type: integer }
        covered: { type: integer }
        uncovered_totals:
          $ref: "#/components/schemas/AreaStats"
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/Attribution"

    FeatureCollection:
      type: object
      properties:
        type: { type: string, example: FeatureCollection }
        generation: { type: string }
        kind: { type: string }
        adm: { type: string }
        count: { type: integer }
        total: { type: integer }
        attribution:
          type: array
          description: |
            Present where a source of these boundaries requires acknowledgement. A foreign
            member of the collection, which GeoJSON permits and which the other members here
            already use; a parser that ignores unknown members is unaffected.
          items:
            $ref: "#/components/schemas/Attribution"
        features:
          type: array
          items: { type: object }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    NoPackForCountry:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: no_pack_for_country }
            message: { type: string }
            country: { type: string, example: IN, description: "The country asked for" }
            countries:
              type: array
              description: What this deployment does serve
              items: { type: string }
              example: [ZA]
        generation:
          type: string
          nullable: true
          description: Always null — no generation applies to a country with no pack

  responses:
    BadRequest:
      description: Missing or invalid query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or unknown host key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Server / database error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GeometryNotServed:
      description: |
        This pack may not serve geometry for that country: the source's conditions forbid
        redistributing its boundaries, so no polygon is returned — not simplified, not verbatim.
        error.code is geometry_not_served and error.attribution names the source to credit.
        403 rather than 400: the request is well formed and understood, and refused because of
        what the source permits. /point still resolves a coordinate to a cell and
        /v1/places/areas/search still returns cells with their parents; only the polygons are
        withheld. Affects /v1/places/geojson, /area/{area_id}/geojson and
        /street/{street_id}/geojson.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WithinUnsupported:
      description: |
        The search was constrained to an area this pack cannot constrain by: it has no geometry
        and nothing claims it as a parent. error.code is within_unsupported and error.within
        names the target. Refused rather than answered with an empty list, which a host cannot
        tell from "no matches" — the distinction this pack's geometry-free cells exist inside.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such path. Returned with or without a host key, and carries error.code not_found,
        which is what distinguishes it from no_pack_for_country. The header
        x-places-generation is absent. Every path this deployment has is in this document.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoPackForCountry:
      description: |
        No pack covers the country asked for. Refused by name rather than answered with an empty
        200, which a host cannot tell apart from a coordinate in the sea, and never stamped with
        another country's generation. The header x-places-generation is absent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NoPackForCountry" }
